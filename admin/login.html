<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inloggen - StrideStore Admin</title>

  <!-- Google Fonts: zelfde fonts, maar zakelijkere toepassing dan de publieke site -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <!-- Aparte stylesheet, specifiek voor de admin-omgeving -->
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">

  <main class="login-box">
    <h1>StrideStore Admin</h1>
    <p class="login-subtitle">Log in om de winkel te beheren</p>

    <form class="login-form">
      <label for="email">E-mailadres</label>
      <input type="email" id="email" name="email" placeholder="jouw@email.be" required>

      <label for="password">Wachtwoord</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>

      <button type="submit" class="btn-login">Inloggen</button>
    </form>
  </main>

</body>
</html>
